<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trip Map | Scotland Golf Adventure 2026</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="map-section">
                <h2>Our Journey Through Scotland</h2>
                <p class="intro-text">
                    Follow our route from Edinburgh to the Highlands and back
                </p>
                <div id="map"></div>
                <div class="map-legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <span class="marker golf">⛳</span> Golf Courses
                    </div>
                    <div class="legend-item">
                        <span class="marker whisky">🥃</span> Distilleries
                    </div>
                    <div class="legend-item">
                        <span class="marker castle">🏰</span> Castles & Sights
                    </div>
                    <div class="legend-item">
                        <span class="marker accommodation">🏨</span> Overnight
                        Stops
                    </div>
                    <div class="legend-item">
                        <span class="line route">━━━</span> Our Route
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>
                🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland Golf Adventure 2026 •
                <a href="index.html">Back to Home</a>
            </p>
        </footer>

        <script>
            // Initialize map centered on Scotland
            var map = L.map("map").setView([56.4907, -4.2026], 7);

            // Add OpenStreetMap tiles
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "© OpenStreetMap contributors",
                maxZoom: 19,
            }).addTo(map);

            // Define custom icons
            var golfIcon = L.divIcon({
                html: '<div class="custom-marker golf">⛳</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var whiskyIcon = L.divIcon({
                html: '<div class="custom-marker whisky">🥃</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var castleIcon = L.divIcon({
                html: '<div class="custom-marker castle">🏰</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var hotelIcon = L.divIcon({
                html: '<div class="custom-marker hotel">🏨</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            // Day 1-2: Edinburgh & North Berwick
            var edinburgh = L.marker([55.9533, -3.1883], { icon: castleIcon })
                .bindPopup("<b>Edinburgh Airport</b><br>Day 1: Arrival")
                .addTo(map);

            var northBerwick = L.marker([56.0596, -2.7209], { icon: hotelIcon })
                .bindPopup(
                    "<b>North Berwick</b><br>Days 1-2: Accommodation<br>Recovery & exploration",
                )
                .addTo(map);

            var dirleTon = L.marker([56.0427, -2.7779], { icon: castleIcon })
                .bindPopup("<b>Dirleton Castle</b><br>Day 2: Sightseeing")
                .addTo(map);

            // Day 2: Gullane
            var gullane = L.marker([56.037, -2.8296], { icon: golfIcon })
                .bindPopup(
                    "<b>Gullane Golf Club</b><br>Day 2: First round!<br>#2 or #3 Course<br>£60-90",
                )
                .addTo(map);

            // Day 5: Crail (backup if no Old Course ballot win)
            var crail = L.marker([56.2556, -2.6291], { icon: golfIcon })
                .bindPopup(
                    "<b>Crail Balcomie Links</b><br>Day 5 backup (if no Old Course)<br>7th oldest club (1786)<br>£60-85",
                )
                .addTo(map);

            // Day 3-5: St Andrews area
            var stAndrews = L.marker([56.3398, -2.7967], { icon: golfIcon })
                .bindPopup(
                    "<b>St Andrews Links</b><br>Days 4-5: The Home of Golf<br>Castle Course (recommended), Jubilee, Eden<br>Old Course ballot attempts!",
                )
                .addTo(map);

            // Strathkinness Airbnb - BOOKED
            var strathkinness = L.marker([56.3547, -2.8667], {
                icon: hotelIcon,
            })
                .bindPopup(
                    "<b>Strathkinness Airbnb</b><br>✅ BOOKED: July 18-20<br>28 High Road, KY16 9XY<br>4 bedrooms, 5 min to courses<br>Full kitchen, parking, quiet village",
                )
                .addTo(map);

            var stAndrewsCathedral = L.marker([56.341, -2.7915], {
                icon: castleIcon,
            })
                .bindPopup(
                    "<b>St Andrews Cathedral</b><br>Day 3: Ruins & history",
                )
                .addTo(map);

            // East Neuk Villages
            var anstruther = L.marker([56.2226, -2.6997], { icon: castleIcon })
                .bindPopup(
                    "<b>Anstruther</b><br>Day 3: Best fish & chips!<br>East Neuk fishing village",
                )
                .addTo(map);

            // Day 6: Carnoustie
            var carnoustie = L.marker([56.5003, -2.7042], { icon: golfIcon })
                .bindPopup(
                    "<b>Carnoustie Golf Links</b><br>Day 6: Burnside Course<br>Same property as Championship Course<br>£90-110",
                )
                .addTo(map);

            // Day 7: Highlands
            var boatOfGarten = L.marker([57.2444, -3.7986], { icon: golfIcon })
                .bindPopup(
                    "<b>Boat of Garten Golf Club</b><br>Day 7: Highland golf<br>Cairngorms setting<br>£50-70",
                )
                .addTo(map);

            var grantownOnSpey = L.marker([57.3278, -3.6075], {
                icon: golfIcon,
            })
                .bindPopup(
                    "<b>Grantown-on-Spey GC</b><br>Day 7 alternative Highland course<br>£45-65",
                )
                .addTo(map);

            var aviemore = L.marker([57.1952, -3.8263], { icon: hotelIcon })
                .bindPopup(
                    "<b>Aviemore/Grantown</b><br>Day 6-7: Highland accommodation",
                )
                .addTo(map);

            // Distilleries
            var glenlivet = L.marker([57.3019, -3.3283], { icon: whiskyIcon })
                .bindPopup(
                    "<b>The Glenlivet Distillery</b><br>Day 7 option: Speyside whisky<br>£15-25",
                )
                .addTo(map);

            var dalwhinnie = L.marker([56.9358, -4.2447], { icon: whiskyIcon })
                .bindPopup(
                    "<b>Dalwhinnie Distillery</b><br>Day 7 option: Highest in Scotland<br>£15-25",
                )
                .addTo(map);

            var blairAthol = L.marker([56.7016, -3.7401], { icon: whiskyIcon })
                .bindPopup(
                    "<b>Blair Athol Distillery</b><br>Day 6: Gateway to Highlands<br>£15-25",
                )
                .addTo(map);

            var pitlochry = L.marker([56.7026, -3.735], { icon: castleIcon })
                .bindPopup(
                    "<b>Pitlochry</b><br>Day 6: Highland town<br>Lunch stop",
                )
                .addTo(map);

            // Optional: Stirling Castle
            var stirling = L.marker([56.1165, -3.9369], { icon: castleIcon })
                .bindPopup(
                    "<b>Stirling Castle</b><br>Day 7: Optional stop on way to Edinburgh",
                )
                .addTo(map);

            // Draw the route
            var route = [
                [55.9533, -3.1883], // Day 1: Edinburgh Airport
                [56.0596, -2.7209], // Days 1-2: North Berwick
                [56.037, -2.8296], // Day 2: Gullane Golf
                [56.2226, -2.6997], // Day 3: Anstruther (fish & chips)
                [56.3547, -2.8667], // Days 3-5: Strathkinness Airbnb
                [56.3398, -2.7967], // Days 4-5: St Andrews Golf
                [56.5003, -2.7042], // Day 6: Carnoustie
                [56.7016, -3.7401], // Day 6: Pitlochry/Blair Athol
                [57.2444, -3.7986], // Day 7: Boat of Garten
                [57.3019, -3.3283], // Day 7: Glenlivet/Speyside
                [56.1165, -3.9369], // Day 7: Stirling (optional)
                [55.9533, -3.1883], // Day 8: Back to Edinburgh
            ];

            var polyline = L.polyline(route, {
                color: "#1e3a5f",
                weight: 3,
                opacity: 0.7,
                dashArray: "10, 5",
            }).addTo(map);

            // Fit map to show entire route
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        </script>
    </body>
</html>
