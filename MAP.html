<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trip Map | Scotland Golf Adventure 2026</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="map-section">
                <h2>Our Journey Through Scotland</h2>
                <p class="intro-text">
                    Follow our route from Edinburgh to the Highlands and back
                </p>
                <div id="map"></div>
                <div class="map-legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <span class="marker golf">⛳</span> Golf Courses
                    </div>
                    <div class="legend-item">
                        <span class="marker whisky">🥃</span> Distilleries
                    </div>
                    <div class="legend-item">
                        <span class="marker castle">🏰</span> Castles & Sights
                    </div>
                    <div class="legend-item">
                        <span class="marker accommodation">🏨</span> Overnight
                        Stops
                    </div>
                    <div class="legend-item">
                        <span class="line route">━━━</span> Our Route
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>
                🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland Golf Adventure 2026 •
                <a href="index.html">Back to Home</a>
            </p>
        </footer>

        <script>
            // Initialize map centered on Scotland
            var map = L.map("map").setView([56.8, -3.2], 7);

            // Add OpenStreetMap tiles
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "© OpenStreetMap contributors",
                maxZoom: 19,
            }).addTo(map);

            // Define custom icons
            var golfIcon = L.divIcon({
                html: '<div class="custom-marker golf">⛳</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var whiskyIcon = L.divIcon({
                html: '<div class="custom-marker whisky">🥃</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var castleIcon = L.divIcon({
                html: '<div class="custom-marker castle">🏰</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var hotelIcon = L.divIcon({
                html: '<div class="custom-marker hotel">🏨</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            // Night 1 — Tuesday June 30: Edinburgh
            var dakotaEdinburgh = L.marker([55.9533, -3.1883], { icon: hotelIcon })
                .bindPopup(
                    "<b>Dakota Edinburgh Hotel</b> 📋 TO BE BOOKED<br>Night 1 — Tuesday June 30 | 3 rooms<br>Edinburgh Airport area<br>Arrival night base",
                )
                .addTo(map);

            // Day 3 — Wednesday July 1: Dunbar Golf Club (en route to Gullane)
            var dunbar = L.marker([56.0024, -2.5127], { icon: golfIcon })
                .bindPopup(
                    "<b>Dunbar Golf Club</b> 📋 TO BE BOOKED<br>Day 3 — Wednesday July 1: Morning tee time<br>East Links, Dunbar EH42 1LL | £50–70<br>Alan's recommendation | Drive to Gullane after",
                )
                .addTo(map);

            // Nights 2–4 — July 1, 2, 3: Gullane (Maule House)
            var gullaneApt = L.marker([56.037, -2.8296], { icon: hotelIcon })
                .bindPopup(
                    "<b>Maule House, Gullane</b> ✅ CONFIRMED<br>8 Maule Terrace, Central Gullane EH31 2DB | Reg: EL00404F<br>Nights 2–4 — Wed Jul 1, Thu Jul 2, Fri Jul 3<br>1 min walk: The Bonnie Badger (Michelin) + Gullane Golf Club",
                )
                .addTo(map);

            // Days 4–5: Gullane Golf Club
            var gullane = L.marker([56.0370, -2.8310], { icon: golfIcon })
                .bindPopup(
                    "<b>Gullane Golf Club</b><br>Day 4 — Thu Jul 2: #1 Championship 📋 TO BE BOOKED | £90–120<br>Day 5 — Fri Jul 3: #3 Noon ✅ CONFIRMED + #2 early 📋 TO BE BOOKED<br>📞 +44 1620 842255",
                )
                .addTo(map);

            // Day 4 afternoon: Dirleton Castle
            var dirleton = L.marker([56.0427, -2.7779], { icon: castleIcon })
                .bindPopup(
                    "<b>Dirleton Castle</b><br>Day 4 afternoon option | 15 min from Gullane<br>13th century ruin | East Lothian",
                )
                .addTo(map);

            // Night 5 — Saturday July 4: St Andrews
            var stAndrewsApt = L.marker([56.3398, -2.7967], { icon: hotelIcon })
                .bindPopup(
                    "<b>Georgian Sandstone Apartment, St Andrews</b> ✅ CONFIRMED<br>Night 5 — Saturday July 4 | 3 bedrooms<br>Minutes from Old Course | Market Street 30 seconds<br>Checkout Sun Jul 5 — 7:45 AM departure for Dumbarnie",
                )
                .addTo(map);

            // Old Course St Andrews
            var oldCourse = L.marker([56.3421, -2.8020], { icon: golfIcon })
                .bindPopup(
                    "<b>St Andrews Old Course</b> 🎲 BALLOT<br>Ballot #1 — enter Thu Jul 2 for Fri Jul 3<br>Ballot #2 — enter Sat Jul 4 for Mon Jul 6<br>~44% cumulative odds | Results 4:30 PM same day",
                )
                .addTo(map);

            // St Andrews Cathedral
            var stAndrewsCathedral = L.marker([56.341, -2.7915], { icon: castleIcon })
                .bindPopup(
                    "<b>St Andrews Cathedral</b><br>Day 6 — Saturday July 4: Afternoon sightseeing<br>Independence Day in St Andrews!",
                )
                .addTo(map);

            // Anstruther Fish Bar — East Neuk
            var anstruther = L.marker([56.2226, -2.6997], { icon: castleIcon })
                .bindPopup(
                    "<b>Anstruther Fish Bar</b><br>Best fish & chips in Scotland<br>East Neuk — worth the detour",
                )
                .addTo(map);

            // Day 7 — Sunday July 5: Dumbarnie Links
            var dumbarnie = L.marker([56.1979, -2.9645], { icon: golfIcon })
                .bindPopup(
                    "<b>Dumbarnie Links</b> ✅ CONFIRMED<br>Day 7 — Sunday July 5: 08:50 AM | Ref: 59655<br>A917, Leven, Fife KY8 6JQ<br>Contact: Jackie Wright | +44 (0)1334 845 945<br>Clive Clark design, 2020 | Drive to Nairn after lunch",
                )
                .addTo(map);

            // Nights 7–8 — July 5, 6: Nairn
            var nairnCottage = L.marker([57.5813, -3.8756], { icon: hotelIcon })
                .bindPopup(
                    "<b>51 Society Street, Nairn</b> ✅ CONFIRMED (Mon Jul 6)<br>Nights 7–8 — Sun Jul 5 & Mon Jul 6 | Checkout Tue Jul 7 6:30 AM<br>Stone fisherman's cottage | Private walled garden<br>200 yards from East Beach | 2 min from Nairn Golf Club<br>⚠️ Confirm Sunday July 5 availability",
                )
                .addTo(map);

            // Day 8 — Monday July 6: Nairn Golf Club
            var nairnGolf = L.marker([57.5925, -3.8656], { icon: golfIcon })
                .bindPopup(
                    "<b>Nairn Golf Club</b> 📋 TO BE BOOKED<br>Day 8 — Monday July 6: Early tee time (on course by 8 AM)<br>Walker Cup 1999 venue | Moray Firth coastal links | £100+",
                )
                .addTo(map);

            // Day 8 — Monday July 6: Glenfarclas Distillery
            var glenfarclas = L.marker([57.3786, -3.3319], { icon: whiskyIcon })
                .bindPopup(
                    "<b>Glenfarclas Distillery</b> 📋 TO BE BOOKED<br>Day 8 — Monday July 6: Afternoon<br>Ballindalloch, Banffshire AB37 9BD<br>Family owned since 1836 | +44 (0)1807 500345",
                )
                .addTo(map);

            // Cawdor Castle — optional Day 8
            var cawdor = L.marker([57.5122, -3.9777], { icon: castleIcon })
                .bindPopup(
                    "<b>Cawdor Castle</b><br>Day 8 afternoon option | ~15 min from Nairn<br>Shakespeare's Macbeth | Family home, beautiful gardens",
                )
                .addTo(map);

            // Draw the route: Edinburgh → Dunbar → Gullane → St Andrews → Dumbarnie → Nairn → Edinburgh
            var route = [
                [55.9533, -3.1883], // Night 1: Edinburgh (arrival Tue Jun 30)
                [56.0024, -2.5127], // Day 3: Dunbar Golf (Wed Jul 1, en route)
                [56.037, -2.8296],  // Nights 2–4: Gullane (Wed Jul 1 – Fri Jul 3)
                [56.3398, -2.7967], // Night 5: St Andrews (Sat Jul 4)
                [56.1979, -2.9645], // Day 7: Dumbarnie Links (Sun Jul 5 morning)
                [57.5813, -3.8756], // Nights 7–8: Nairn (Sun Jul 5 – Mon Jul 6)
                [55.9533, -3.1883], // Day 9: Edinburgh Airport (departure Tue Jul 7)
            ];

            var polyline = L.polyline(route, {
                color: "#1e3a5f",
                weight: 3,
                opacity: 0.7,
                dashArray: "10, 5",
            }).addTo(map);

            // Fit map to show entire route
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        </script>
    </body>
</html>
