<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trip Map | Scotland Golf Adventure 2026</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="map-section">
                <h2>Our Journey Through Scotland</h2>
                <p class="intro-text">
                    Follow our route from Edinburgh to the Highlands and back
                </p>
                <div id="map"></div>
                <div class="map-legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <span class="marker golf">⛳</span> Golf Courses
                    </div>
                    <div class="legend-item">
                        <span class="marker whisky">🥃</span> Distilleries
                    </div>
                    <div class="legend-item">
                        <span class="marker castle">🏰</span> Castles & Sights
                    </div>
                    <div class="legend-item">
                        <span class="marker accommodation">🏨</span> Overnight
                        Stops
                    </div>
                    <div class="legend-item">
                        <span class="line route">━━━</span> Our Route
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>
                🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland Golf Adventure 2026 •
                <a href="index.html">Back to Home</a>
            </p>
        </footer>

        <script>
            // Initialize map centered on Scotland
            var map = L.map("map").setView([56.4907, -4.2026], 7);

            // Add OpenStreetMap tiles
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "© OpenStreetMap contributors",
                maxZoom: 19,
            }).addTo(map);

            // Define custom icons
            var golfIcon = L.divIcon({
                html: '<div class="custom-marker golf">⛳</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var whiskyIcon = L.divIcon({
                html: '<div class="custom-marker whisky">🥃</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var castleIcon = L.divIcon({
                html: '<div class="custom-marker castle">🏰</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var hotelIcon = L.divIcon({
                html: '<div class="custom-marker hotel">🏨</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            // Day 1-2: Edinburgh & Gullane
            var edinburgh = L.marker([55.9533, -3.1883], { icon: castleIcon })
                .bindPopup("<b>Edinburgh Airport</b><br>Day 1: Arrival")
                .addTo(map);

            var gullaneApt = L.marker([56.037, -2.8296], { icon: hotelIcon })
                .bindPopup(
                    "<b>Gullane Village Apartment (Maule House)</b><br>📋 Nights 1–2: Thu Jul 2 & Fri Jul 3<br>Central Gullane, East Lothian<br>1 min walk to The Bonnie Badger (Michelin-starred)<br>Walk to Gullane Golf Club",
                )
                .addTo(map);

            var dirleTon = L.marker([56.0427, -2.7779], { icon: castleIcon })
                .bindPopup("<b>Dirleton Castle</b><br>Day 2: Sightseeing")
                .addTo(map);

            // Day 2: Gullane
            var gullane = L.marker([56.037, -2.8296], { icon: golfIcon })
                .bindPopup(
                    "<b>Gullane Golf Club</b><br>Day 2: First round!<br>#2 or #3 Course<br>£60-90",
                )
                .addTo(map);

            // Day 5: Crail (backup if no Old Course ballot win)
            var crail = L.marker([56.2556, -2.6291], { icon: golfIcon })
                .bindPopup(
                    "<b>Crail Balcomie Links</b><br>Day 5 backup (if no Old Course)<br>7th oldest club (1786)<br>£60-85",
                )
                .addTo(map);

            // Day 3-5: St Andrews area
            var stAndrews = L.marker([56.3398, -2.7967], { icon: golfIcon })
                .bindPopup(
                    "<b>St Andrews Links</b><br>Days 4-5: The Home of Golf<br>Castle Course (recommended), Jubilee, Eden<br>Old Course ballot attempts!",
                )
                .addTo(map);

            // St Andrews Apartment - Nights 3-4
            var stAndrewsApt = L.marker([56.3398, -2.7967], {
                icon: hotelIcon,
            })
                .bindPopup(
                    "<b>Georgian Sandstone Apartment, St Andrews</b><br>📋 Nights 3–4: Sat Jul 5 & Sun Jul 6<br>Minutes from Old Course, near West Sands Beach<br>3 bedrooms, 4 beds — one room per person<br>Traditional Georgian, light and airy",
                )
                .addTo(map);

            var stAndrewsCathedral = L.marker([56.341, -2.7915], {
                icon: castleIcon,
            })
                .bindPopup(
                    "<b>St Andrews Cathedral</b><br>Day 3: Ruins & history",
                )
                .addTo(map);

            // East Neuk Villages
            var anstruther = L.marker([56.2226, -2.6997], { icon: castleIcon })
                .bindPopup(
                    "<b>Anstruther</b><br>Day 3: Best fish & chips!<br>East Neuk fishing village",
                )
                .addTo(map);

            // Day 6: Carnoustie
            var carnoustie = L.marker([56.5003, -2.7042], { icon: golfIcon })
                .bindPopup(
                    "<b>Carnoustie Golf Links</b><br>Day 6: Burnside Course<br>Same property as Championship Course<br>£90-110",
                )
                .addTo(map);

            // Day 7: Highlands
            var boatOfGarten = L.marker([57.2444, -3.7986], { icon: golfIcon })
                .bindPopup(
                    "<b>Boat of Garten Golf Club</b><br>Day 8: Highland golf<br>Cairngorms National Park<br>Walk-up, 9 or 18 holes | £50-70",
                )
                .addTo(map);

            var grantownOnSpey = L.marker([57.3278, -3.6075], {
                icon: hotelIcon,
            })
                .bindPopup(
                    "<b>Grantown-on-Spey</b><br>📋 Highland Airbnb — Night 7 (Tue Jul 7)<br>Ideal base — 20 min to Glenfarclas",
                )
                .addTo(map);

            var aviemore = L.marker([57.1952, -3.8263], { icon: hotelIcon })
                .bindPopup(
                    "<b>Aviemore</b><br>Highland accommodation alternative<br>35 min to Glenfarclas",
                )
                .addTo(map);

            // Distilleries
            var glenfarclas = L.marker([57.3786, -3.3319], { icon: whiskyIcon })
                .bindPopup(
                    "<b>Glenfarclas Distillery</b><br>Day 8: Speyside whisky — PREBOOK<br>Ballindalloch, Banffshire AB37 9BD<br>Family owned since 1836 | +44 (0)1807 500345",
                )
                .addTo(map);

            var blairAthol = L.marker([56.7016, -3.7401], { icon: whiskyIcon })
                .bindPopup(
                    "<b>Blair Athol Distillery</b><br>Day 7: Gateway to Highlands<br>On the A9 — no detour | £15-25",
                )
                .addTo(map);

            var pitlochry = L.marker([56.7026, -3.735], { icon: castleIcon })
                .bindPopup(
                    "<b>Pitlochry</b><br>Day 7: Highland town<br>Blair Athol Distillery stop",
                )
                .addTo(map);

            // Draw the route
            var route = [
                [55.9533, -3.1883], // Day 1: Edinburgh Airport
                [56.037, -2.8296], // Days 1-2: Gullane (Apt + Golf)
                [56.2226, -2.6997], // Day 3: Anstruther (fish & chips)
                [56.3398, -2.7967], // Days 4-6: St Andrews (Apt + Golf)
                [56.7016, -3.7401], // Day 7: Pitlochry/Blair Athol
                [57.3278, -3.6075], // Day 7: Grantown-on-Spey (overnight)
                [57.2444, -3.7986], // Day 8: Boat of Garten Golf
                [57.3786, -3.3319], // Day 8: Glenfarclas Distillery
                [55.9533, -3.1883], // Day 8: Back to Edinburgh
            ];

            var polyline = L.polyline(route, {
                color: "#1e3a5f",
                weight: 3,
                opacity: 0.7,
                dashArray: "10, 5",
            }).addTo(map);

            // Fit map to show entire route
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        </script>
    </body>
</html>
