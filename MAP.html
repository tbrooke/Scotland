<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trip Map | Scotland Golf Adventure 2026</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </head>
    <body>
        <div class="container">
            <section class="map-section">
                <h2>Our Journey Through Scotland</h2>
                <p class="intro-text">
                    From Edinburgh through East Lothian and into the Kingdom of Fife
                </p>
                <div id="map"></div>
                <div class="map-legend">
                    <h3>Legend</h3>
                    <div class="legend-item">
                        <span class="marker golf">⛳</span> Golf Courses
                    </div>
                    <div class="legend-item">
                        <span class="marker castle">🏰</span> Sights &amp; Pubs
                    </div>
                    <div class="legend-item">
                        <span class="marker accommodation">🏨</span> Overnight
                        Stops
                    </div>
                    <div class="legend-item">
                        <span class="line route">━━━</span> Our Route
                    </div>
                </div>
            </section>
        </div>

        <footer>
            <p>
                🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland Golf Adventure 2026 •
                <a href="index.html">Back to Home</a>
            </p>
        </footer>

        <script>
            // Initialize map centered on East Lothian / Fife
            var map = L.map("map").setView([56.15, -2.85], 9);

            // Add OpenStreetMap tiles
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "© OpenStreetMap contributors",
                maxZoom: 19,
            }).addTo(map);

            // Define custom icons
            var golfIcon = L.divIcon({
                html: '<div class="custom-marker golf">⛳</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var castleIcon = L.divIcon({
                html: '<div class="custom-marker castle">🏰</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            var hotelIcon = L.divIcon({
                html: '<div class="custom-marker hotel">🏨</div>',
                className: "custom-div-icon",
                iconSize: [30, 30],
            });

            // Night 1 — Tuesday June 30: Edinburgh
            var edinburghHotel = L.marker([55.9495, -3.1777], { icon: hotelIcon })
                .bindPopup(
                    "<b>Edinburgh Marriott Hotel Holyrood</b><br>Night 1 — Tuesday June 30 | Conf: 94880250 | £621.00<br>81 Holyrood Road, Edinburgh EH8 8AU<br>Arrival day + dinner with Alan",
                )
                .addTo(map);

            // Day 3 — Wednesday July 1: Dunbar Golf Club (all three)
            var dunbar = L.marker([56.0024, -2.5127], { icon: golfIcon })
                .bindPopup(
                    "<b>Dunbar Golf Club</b> ⛳ Round 1<br>Wednesday July 1: 2:21 PM | All three of us<br>East Links, Dunbar EH42 1LL<br>Classic East Lothian links — Alan's recommendation",
                )
                .addTo(map);

            // Nights 2–3 — July 1, 2: Gullane (Maule House)
            var gullaneApt = L.marker([56.037, -2.8296], { icon: hotelIcon })
                .bindPopup(
                    "<b>Maule House, Gullane</b><br>8 Maule Terrace, Central Gullane EH31 2DB | Reg: EL00404F<br>Nights 2–3 — Wed Jul 1 &amp; Thu Jul 2<br>1 min walk: The Bonnie Badger (Michelin) + Gullane Golf Club",
                )
                .addTo(map);

            // Day 4: Gullane Golf Club (#1 all three, #2 the twins — 36 holes)
            var gullane = L.marker([56.0370, -2.8310], { icon: golfIcon })
                .bindPopup(
                    "<b>Gullane Golf Club</b> ⛳ Rounds 2 &amp; 3<br>Thu Jul 2 — #1 at 11:28 AM (all three)<br>then #2 for the twins — 36 holes on the day<br>Panoramic Firth of Forth views",
                )
                .addTo(map);

            // Day 5: Castle Course (all three) — Friday, en route into Fife
            var castleCourse = L.marker([56.3290, -2.7720], { icon: golfIcon })
                .bindPopup(
                    "<b>St Andrews Castle Course</b> ⛳ Round 4<br>Friday July 3: 3:00 PM | All three of us<br>Kinkell Braes | David McLay Kidd design 2008<br>Dramatic clifftop links | North Sea views",
                )
                .addTo(map);

            // Night 4 — Fri Jul 3: The Inn at Kingsbarns
            var kingsbarnsInn = L.marker([56.3033, -2.6297], { icon: hotelIcon })
                .bindPopup(
                    "<b>The Inn at Kingsbarns</b> 🏨 Night 4<br>Friday July 3 | A pub with rooms in Kingsbarns village<br>Minutes from the first tee — perfect for a dawn start<br>stayinapub.co.uk",
                )
                .addTo(map);

            // Kingsbarns Golf Links — played twice (Sat the twins, Mon all three)
            var kingsbarns = L.marker([56.2931, -2.6389], { icon: golfIcon })
                .bindPopup(
                    "<b>Kingsbarns Golf Links</b> ⛳ Rounds 5 &amp; 7<br>Sat Jul 4, 7:30 AM (Richard &amp; Max)<br>Mon Jul 6 (all three — Dad + caddy Gary)<br>Kyle Phillips design, 2000 | Two miles of coastline",
                )
                .addTo(map);

            // Nights 5–7 — Sat Jul 4, Sun Jul 5, Mon Jul 6: St Andrews
            var stAndrewsApt = L.marker([56.3398, -2.7967], { icon: hotelIcon })
                .bindPopup(
                    "<b>Georgian Sandstone Apartment, St Andrews</b><br>3 nights — Sat Jul 4, Sun Jul 5, Mon Jul 6<br>3 bedrooms | Market Street 30 seconds<br>Extended when the Highlands leg was dropped",
                )
                .addTo(map);

            // The Dunvegan — Independence Day drinks with Faheem
            var dunvegan = L.marker([56.3402, -2.7972], { icon: castleIcon })
                .bindPopup(
                    "<b>The Dunvegan</b> 🍺 Saturday July 4<br>Celebrated golfers' pub near the 18th<br>Independence Day drinks with Max's friend Faheem<br>Then we walked the Old Course",
                )
                .addTo(map);

            // Old Course — walked it (lost both ballots)
            var oldCourse = L.marker([56.3421, -2.8020], { icon: golfIcon })
                .bindPopup(
                    "<b>St Andrews Old Course</b> 🎲<br>Lost both ballots — no tee time<br>So we walked it on foot: Swilcan Bridge, the 18th<br>Home of golf since 1552 | Closed to golf on Sundays",
                )
                .addTo(map);

            // The Himalayas — Sunday afternoon putting green
            var himalayas = L.marker([56.3436, -2.8025], { icon: golfIcon })
                .bindPopup(
                    "<b>The Himalayas</b> ⛳ Sunday July 5<br>The Ladies' Putting Club (1867)<br>18-hole putting green of rolling humps beside the Old Course<br>Open to all — huge fun",
                )
                .addTo(map);

            // Day 7 — Sunday July 5: Dumbarnie Links (all three)
            var dumbarnie = L.marker([56.1979, -2.9645], { icon: golfIcon })
                .bindPopup(
                    "<b>Dumbarnie Links</b> ⛳ Round 6<br>Sunday July 5: 08:50 AM | Ref: 59655 | All three of us<br>A917, Leven, Fife KY8 6JQ<br>Clive Clark design, 2020 | Most expensive round of the trip",
                )
                .addTo(map);

            // Day 8 — Monday July 6: The Golf House Club, Elie (all three)
            var elie = L.marker([56.1893, -2.8230], { icon: golfIcon })
                .bindPopup(
                    "<b>The Golf House Club, Elie</b> ⛳ Round 8<br>Monday July 6: last tee of the day | All three of us<br>Old Tom Morris links | The starter's submarine periscope<br>The perfect place to finish",
                )
                .addTo(map);

            // Anstruther Fish Bar — East Neuk, on the road to Elie
            var anstruther = L.marker([56.2226, -2.6997], { icon: castleIcon })
                .bindPopup(
                    "<b>Anstruther Fish Bar</b> 🐟<br>Some of the best fish &amp; chips in Scotland<br>East Neuk — right on the road down to Elie",
                )
                .addTo(map);

            // Draw the route: Edinburgh → Dunbar → Gullane → Castle Course → Kingsbarns → St Andrews → Elie → Edinburgh
            var route = [
                [55.9533, -3.1883], // Night 1: Edinburgh (arrival Tue Jun 30)
                [56.0024, -2.5127], // Day 3: Dunbar (Wed Jul 1)
                [56.037, -2.8296],  // Nights 2–3: Gullane (Wed–Thu)
                [56.3290, -2.7720], // Day 5: Castle Course (Fri, into Fife)
                [56.3033, -2.6297], // Night 4: The Inn at Kingsbarns (Fri)
                [56.3398, -2.7967], // Nights 5–7: St Andrews (Sat–Mon)
                [56.1893, -2.8230], // Day 8: Elie (Mon)
                [55.9533, -3.1883], // Day 9: Edinburgh Airport (departure Tue Jul 7)
            ];

            var polyline = L.polyline(route, {
                color: "#1e3a5f",
                weight: 3,
                opacity: 0.7,
                dashArray: "10, 5",
            }).addTo(map);

            // Fit map to show entire route
            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
        </script>
    </body>
</html>
